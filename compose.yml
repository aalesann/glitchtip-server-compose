networks:
  glitchtip-network:
    driver: bridge

volumes:
  glitchtip-postgres-data:
  glitchtip-uploads:

x-environment: &default-environment
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@glitchtip-postgres:5432/${POSTGRES_DB}
  VALKEY_URL: redis://glitchtip-valkey:6379
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-no-usar-en-produccion}
  EMAIL_URL: ${EMAIL_URL:-consolemail://}
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8000}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-dev@localhost}
  ENABLE_ADMIN: "True"
  ENABLE_OPENAPI: "False"

services:
  glitchtip-postgres:
    image: postgres:18-alpine
    container_name: glitchtip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - glitchtip-postgres-data:/var/lib/postgresql
    networks:
      - glitchtip-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  glitchtip-valkey:
    image: valkey/valkey:9-alpine
    container_name: glitchtip-valkey
    restart: unless-stopped
    networks:
      - glitchtip-network

  glitchtip-web:
    image: glitchtip/glitchtip:6
    container_name: glitchtip-web
    restart: unless-stopped
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_started
    environment:
      <<: *default-environment
      SERVER_ROLE: all_in_one
    ports:
      # Alcanzable desde el browser como localhost:8000 y desde otros
      # contenedores (ej. sgp-backend) como host.docker.internal:8000
      - "8000:8000"
    volumes:
      - glitchtip-uploads:/code/uploads
    networks:
      - glitchtip-network
